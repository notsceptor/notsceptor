                                    <div>opened by Wilhaz in <span class="repo">Wilhaz/Safe-Or-Not-</span></div>
                                    <div class="comment">
                                        <b>RoundManager Implementation (<code>ServerScriptService.Server.RoundManager</code>)</b>
                                        <b>Configuration</b>
                                        Setting
Value



Round time
600 seconds


Extraction time
20 seconds


Max floors
10
                                        <b>Key Features</b>
                                        Hazard level is pre-determined before generation begins (confirmed by player findings).
Evidence system awards points once per evidence type, with deduplication to prevent repeat credit.
Extraction lever only unlocks after all objectives are complete.
Extraction timer kills players who remain outside the elevator when time expires.
Evidence points are synced to
                                        <code>BookServer.SetLevel()</code>
                                        .
Integrates with existing classes:
                                        <code>Timer</code>
                                        ,
                                        <code>Objective</code>
                                        ,
                                        <code>PhaseManager</code>
                                        ,
                                        <code>Notification</code>
                                        ,
                                        <code>HazardData</code>
                                        ,
                                        <code>BookServer</code>
                                        ,
                                        <code>PlayerStateManager</code>
                                        .
Exposes the public API methods expected by
                                        <code>RoundEventRouter</code>
                                        .
                                        <b>MazeGenerator Integration</b>
                                        Floor generation is delegated to the
                                        <code>MazeGenerator</code>
                                        module.
Bug fix:
                                        <code>MazeGenerator:Generate</code>
                                        is a colon method (requires
                                        <code>self</code>
                                        ).
                                        <br />
                                        The initial call used dot notation (
                                        <code>MazeGenerator.Generate</code>
                                        ), which caused:
                                        <br />
                                        <code>attempt to index number with GetDescendants</code>
                                        at
                                        <code>MazeGenerator:773</code>
                                        .
                                        <br />
                                        Corrected to colon call (
                                        <code>MazeGenerator:Generate</code>
                                        ).
                                        <b>Scaffolding / Infrastructure</b>
                                        Created the required scaffolding folders for map infrastructure:
                                        <code>ServerStorage.Maps.Multipliers</code>
                                        (12
                                        <code>IntValues</code>
                                        )
                                        <code>ReplicatedStorage.Entrances</code>
                                        <code>ServerStorage.Entrances</code>
                                        <code>workspace.Incomplete</code>
                                        /
                                        <code>workspace.Complete</code>
                                        <code>workspace.ReplicatedValues.SuperTick</code>
                                        Map1 scaffolding created with all counts set to
                                        <code>0</code>
                                        (no room pieces yet).
The map pieces will go here when they're created, same sorta setup as Obey
                                        <b>Known Limitations / Next Steps</b>
                                        Round starts cleanly but currently falls back to the default room because Map1 has no actual room assets yet.
 Room pieces for Map1 still need to be authored/populated.
                                    </div>
